<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sales Simulator - 128px</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <div id="ui">
        <div class="stats-panel">
            💰 Деньги: <span id="money">0</span>₽<br>
            📊 Продаж: <span id="sales">0</span>
        </div>
        <div class="stats-panel">
            ⏰ Время: <span id="time">09:00</span><br>
            🎯 Цель: <span id="daily-goal">0</span>/<span id="goal-target">5</span>
        </div>
    </div>
    
    <div id="textbox-container" style="display: none">
        <div id="textbox">
            <p id="dialogue" class="ui-text"></p>
            <div id="options" class="options-container"></div>
            <div class="btn-container">
                <button id="close" class="ui-close-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <button id="interact-btn">💬 Поговорить</button>
    
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
